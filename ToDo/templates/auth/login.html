{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-4">

        <div class="card card-shadow p-4">
            <h4 class="text-center mb-3">Вход</h4>

            <form method="post">
                {% csrf_token %}

                <label>Логин</label>
                <input type="text" name="username"
                       value="{{ request.POST.username|default:'' }}"
                       class="form-control mb-2">

                <label>Пароль</label>
                <input type="password" name="password"
                       class="form-control mb-2">

                <button class="btn btn-main w-100 mt-3">
                    Войти
                </button>
            </form>

        </div>

    </div>
</div>

{% endblock %}
