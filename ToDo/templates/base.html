{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ToDo</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-semibold" href="{% url 'task_list' %}">
            📝 Задачи
        </a>

        <div class="ms-auto d-flex gap-2 align-items-center">

            {% if user.is_authenticated %}
                <a class="btn btn-soft" href="{% url 'task_list' %}">Задачи</a>
                <a class="btn btn-soft" href="{% url 'profile' %}">{{ user.username }}</a>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-danger">Выйти</button>
                </form>
            {% else %}
                <a class="btn btn-outline-dark" href="{% url 'login' %}">Вход</a>
                <a class="btn btn-main" href="{% url 'register' %}">Регистрация</a>
            {% endif %}

        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- СООБЩЕНИЯ -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert 
                {% if message.tags == 'success' %}alert-success
                {% elif message.tags == 'error' %}alert-danger
                {% else %}alert-info{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

</body>
</html>
